<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

.cl-root {
  --paper: #F7F4EC;
  --paper-raised: #FFFFFF;
  --ink: #1B1A17;
  --ink-soft: #6E6B60;
  --line: #E6E1D3;
  --accent: #2E2C27;
  --accent-soft: rgba(46,44,39,0.07);
  --accent-2: #A9A28C;
  --serif: 'Fraunces', Georgia, serif;
  --sans: 'Inter', -apple-system, sans-serif;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.cl-root[data-theme="realestate"] { --accent:#1E3A5F; --accent-soft: rgba(30,58,95,0.08); --accent-2:#8C9A8E; }
.cl-root[data-theme="jewellery"]  { --accent:#6B1E3C; --accent-soft: rgba(107,30,60,0.08); --accent-2:#C9A24B; }
.cl-root[data-theme="perfume"]    { --accent:#4B2E52; --accent-soft: rgba(75,46,82,0.08); --accent-2:#D9A9A0; }
.cl-root[data-theme="fmcg"]       { --accent:#A6331E; --accent-soft: rgba(166,51,30,0.08); --accent-2:#C98A22; }
.cl-root * { box-sizing: border-box; }

/* ---- header ---- */
.cl-header { padding: 24px 40px; border-bottom: 1px solid var(--line); display:flex; align-items:center; justify-content:space-between; background: var(--paper-raised); }
.cl-brand { display:flex; align-items:center; gap: 10px; }
.cl-brand svg { width: 22px; height: 22px; }
.cl-wordmark { font-family: var(--serif); font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.cl-wordmark em { font-style: normal; color: var(--accent); }

.cl-stepper { display:flex; align-items:center; gap: 8px; }
.cl-step { display:flex; align-items:center; gap: 7px; }
.cl-step-dot { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-size: 10.5px; font-weight: 600; color: var(--ink-soft); transition: all .25s; flex-shrink:0; }
.cl-step-dot.done { background: var(--accent); border-color: var(--accent); color: #fff; }
.cl-step-label { font-size: 11.5px; color: var(--ink-soft); font-weight: 500; }
.cl-step.done .cl-step-label { color: var(--ink); }
.cl-step-line { width: 22px; height: 1px; background: var(--line); }
@media (max-width: 820px){ .cl-step-label{ display:none; } }

/* ---- body / hero ---- */
.cl-body { padding: 0 40px 46px; }
.cl-hero {
  position: relative; overflow: hidden; margin: 28px 0 38px;
  background: linear-gradient(135deg, var(--accent-soft), transparent 70%);
  border: 1px solid var(--line); border-radius: 16px; padding: 42px 44px;
}
.cl-hero-icon { position:absolute; right: -10px; top: -18px; width: 190px; height: 190px; opacity: 0.08; stroke: var(--accent); fill:none; stroke-width: 1; }
.cl-hero h1 { position:relative; font-family: var(--serif); font-size: 36px; line-height: 1.14; font-weight: 600; margin: 0 0 12px; letter-spacing: -0.01em; max-width: 560px; }
.cl-hero p { position:relative; color: var(--ink-soft); font-size: 15px; line-height: 1.6; margin: 0; max-width: 520px; }
.cl-hero-pillars { position:relative; display:flex; flex-wrap:wrap; gap: 7px; margin-top: 18px; }
.cl-pillar-chip { font-size: 11px; padding: 4px 10px; border-radius: 20px; background: var(--paper-raised); border: 1px solid var(--line); color: var(--ink-soft); }

.cl-section { margin-bottom: 36px; }
.cl-section-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 15px; }
.cl-section-title { font-family: var(--serif); font-size: 18px; font-weight: 600; display:flex; align-items:center; gap:8px; }
.cl-section-num { color: var(--accent); }
.cl-section-sub { font-size: 12px; color: var(--ink-soft); }

.cl-grid4 { display:grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
.cl-grid3 { display:grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
@media (max-width: 780px){ .cl-grid4, .cl-grid3 { grid-template-columns: 1fr 1fr; } }

.cl-card {
  position:relative; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 14px;
  padding: 18px 16px 16px; cursor:pointer; text-align:left; transition: border-color .2s, box-shadow .2s, transform .12s;
}
.cl-card:hover { border-color: var(--accent-2); transform: translateY(-1px); }
.cl-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cl-card-swatch { position:absolute; top:0; left:16px; right:16px; height:3px; border-radius: 0 0 3px 3px; }
.cl-card svg { width: 24px; height: 24px; stroke: var(--accent); fill:none; stroke-width: 1.5; margin: 10px 0 12px; display:block; }
.cl-card-name { font-family: var(--serif); font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.cl-card-desc { font-size: 11.5px; color: var(--ink-soft); line-height: 1.45; }
.cl-card-check { position:absolute; top:14px; right:14px; width:16px; height:16px; border-radius:50%; background: var(--accent); color:#fff; font-size: 10px; display:flex; align-items:center; justify-content:center; opacity:0; transform: scale(0.6); transition: all .18s; }
.cl-card.selected .cl-card-check { opacity:1; transform: scale(1); }

.cl-plan-card { display:flex; flex-direction:column; gap: 3px; }
.cl-plan-num { font-family: var(--serif); font-size: 30px; font-weight: 600; color: var(--accent); line-height:1; margin-top: 6px; }
.cl-plan-label { font-size: 13.5px; font-weight: 600; margin-top: 4px; }
.cl-plan-sub { font-size: 11.5px; color: var(--ink-soft); }

.cl-dropzone { border: 1.5px dashed var(--line); border-radius: 14px; padding: 28px; text-align:center; cursor:pointer; transition: all .2s; background: var(--paper-raised); }
.cl-dropzone:hover, .cl-dropzone.drag { border-color: var(--accent); background: var(--accent-soft); }
.cl-dropzone svg { width: 26px; height: 26px; stroke: var(--accent-2); fill:none; stroke-width: 1.4; margin-bottom: 10px; }
.cl-dropzone-title { font-size: 13.5px; font-weight: 600; margin-bottom: 3px; }
.cl-dropzone-sub { font-size: 11.5px; color: var(--ink-soft); }

.cl-files { display:flex; flex-wrap:wrap; gap: 8px; margin-top: 12px; }
.cl-file-chip { display:flex; align-items:center; gap:8px; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12px; }
.cl-file-chip .status { color: var(--ink-soft); }
.cl-file-chip button { background:none; border:none; cursor:pointer; color: var(--ink-soft); font-size: 15px; line-height:1; padding: 0 2px; }
.cl-file-chip button:hover { color: var(--accent); }

.cl-chips { display:flex; flex-wrap:wrap; gap: 8px; }
.cl-chip { border: 1px solid var(--line); background: var(--paper-raised); border-radius: 20px; padding: 9px 15px; font-size: 12.5px; font-weight: 500; cursor:pointer; transition: all .15s; }
.cl-chip.selected { border-color: var(--accent); background: var(--accent); color: #fff; }

.cl-generate-row { display:flex; align-items:center; gap: 16px; }
.cl-btn-primary { background: var(--accent); color: #fff; border:none; border-radius: 11px; padding: 15px 28px; font-family: var(--sans); font-size: 14px; font-weight: 600; cursor:pointer; transition: opacity .15s, transform .1s; }
.cl-btn-primary:hover:not(:disabled) { opacity: .88; }
.cl-btn-primary:active:not(:disabled) { transform: scale(0.98); }
.cl-btn-primary:disabled { opacity: .32; cursor:not-allowed; }
.cl-btn-secondary { background: var(--paper-raised); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; font-family: var(--sans); font-size: 12.5px; font-weight: 600; cursor:pointer; transition: border-color .15s; }
.cl-btn-secondary:hover { border-color: var(--accent); }
.cl-hint { font-size: 12px; color: var(--ink-soft); }

.cl-fade { animation: cl-fadein .45s ease both; }
@keyframes cl-fadein { from { opacity:0; transform: translateY(6px);} to {opacity:1; transform:none;} }

.cl-results-head { display:flex; align-items:flex-end; justify-content:space-between; margin: 30px 0 20px; flex-wrap: wrap; gap: 12px; }
.cl-results-title { font-family: var(--serif); font-size: 24px; font-weight: 600; }
.cl-results-actions { display:flex; gap: 8px; }
.cl-posts { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 780px){ .cl-posts { grid-template-columns: 1fr; } }

.cl-post { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display:flex; flex-direction:column; gap: 13px; transition: box-shadow .2s; }
.cl-post:hover { box-shadow: 0 6px 18px -12px var(--accent); }
.cl-post-top { display:flex; align-items:center; justify-content:space-between; }
.cl-post-num { font-family: var(--serif); font-size: 15.5px; font-weight: 600; }
.cl-post-date { font-size: 11.5px; color: var(--ink-soft); margin-top: 1px; }
.cl-post-format { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: #fff; background: var(--accent); padding: 4px 9px; border-radius: 6px; font-weight: 600; white-space:nowrap; }
.cl-post-caption { font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; }
.cl-thread { display:flex; align-items:center; gap: 6px; }
.cl-thread svg { width: 13px; height: 13px; stroke: var(--accent-2); fill:none; stroke-width: 1.6; flex-shrink:0; }
.cl-thread-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent-2); font-weight: 600; }
.cl-post-visual { border-left: 2px solid var(--accent-2); padding-left: 11px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.55; margin-left: 3px; }
.cl-hashtags { display:flex; flex-wrap:wrap; gap: 6px; }
.cl-hashtag { font-size: 11.5px; color: var(--accent); background: var(--accent-soft); padding: 3px 9px; border-radius: 6px; }
.cl-post-copy { align-self:flex-start; font-size: 11px; color: var(--ink-soft); background:none; border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor:pointer; transition: all .15s; }
.cl-post-copy:hover { border-color: var(--accent); color: var(--accent); }

.cl-loading { text-align:center; padding: 60px 20px; }
.cl-spinner { width: 34px; height: 34px; border: 2.5px solid var(--line); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 18px; animation: cl-spin .8s linear infinite; }
@keyframes cl-spin { to { transform: rotate(360deg); } }
.cl-loading-msg { font-size: 13px; color: var(--ink-soft); }
.cl-error { background: #FBEAE7; border: 1px solid #E3B3A9; color: #8A2E1E; border-radius: 10px; padding: 14px 16px; font-size: 13px; margin-bottom: 16px; }
</style>

<div class="cl-root" data-theme="" id="clRoot">
  <div class="cl-header">
    <div class="cl-brand">
      <svg viewBox="0 0 24 24" stroke="var(--ink)" fill="none" stroke-width="1.5"><path d="M4 6c4 0 4 12 8 12s4-12 8-12"/><path d="M4 12h16"/><path d="M4 18c4 0 4-12 8-12s4 12 8 12"/></svg>
      <div class="cl-wordmark">Content<em>Loom</em></div>
    </div>
    <div class="cl-stepper" id="clStepper"></div>
  </div>
  <div class="cl-body" id="clBody"></div>
</div>

<script>
(function(){
  const industries = [
    { id:'realestate', name:'Real Estate', theme:'realestate',
      desc:'Location, amenities, investment case',
      pillars:['Location','Amenities','Lifestyle','Investment value','Property USP','Configuration'],
      voice:'Confident, aspirational, trust-building. Speaks to buyers weighing lifestyle and investment. Uses concrete specifics (locality, layout, connectivity) over vague adjectives.',
      icon:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/>' },
    { id:'jewellery', name:'Jewellery', theme:'jewellery',
      desc:'Craftsmanship, luxury, occasion',
      pillars:['Craftsmanship','Luxury','Occasion','Design','Materials','Emotion','Gifting'],
      voice:'Elevated, sensory, unhurried. Lingers on detail and craft. Ties pieces to moments and emotion rather than specs.',
      icon:'<path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20"/><path d="M9 3l3 6 3-6"/>' },
    { id:'perfume', name:'Product — Perfume', theme:'perfume',
      desc:'Fragrance notes, mood, personality',
      pillars:['Fragrance notes','Mood','Personality','Lifestyle','Luxury','Occasion','Gifting'],
      voice:'Evocative and sensory, builds atmosphere before it sells. Translates scent into feeling, memory, and personality rather than listing ingredients dryly.',
      icon:'<path d="M10 2h4v4h-4z"/><path d="M9 6h6l2 3v11a2 2 0 01-2 2H9a2 2 0 01-2-2V9z"/><path d="M8 13h8"/>' },
    { id:'fmcg', name:'FMCG — Food', theme:'fmcg',
      desc:'Taste, ingredients, everyday moments',
      pillars:['Sensory language','Taste','Ingredients','Convenience','Family','Consumption occasions','Product benefits','Food appeal'],
      voice:'Warm, appetite-driven, everyday. Grounded in real moments (breakfast rush, tiffin, family dinner). Sensory and craveable, never clinical.',
      icon:'<path d="M12 2v6"/><path d="M8 4v4M16 4v4"/><path d="M6 12h12l-1 9H7z"/>' }
  ];

  const plans = [
    { id:'1w', label:'1 Week', posts:3, sub:'Quick sprint' },
    { id:'2w', label:'2 Weeks', posts:6, sub:'Steady cadence' },
    { id:'1m', label:'1 Month', posts:12, sub:'Full content plan' }
  ];

  const formats = ['Feed Post','Carousel','Reel / Video Idea','Story'];

  const state = {
    industry: null, plan: null, files: [], selectedFormats: ['Feed Post'],
    generating: false, error: null, results: null
  };

  const $body = document.getElementById('clBody');
  const $root = document.getElementById('clRoot');
  const $stepper = document.getElementById('clStepper');

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function renderStepper(){
    const steps = [
      { label:'Industry', done: !!state.industry },
      { label:'Plan', done: !!state.plan },
      { label:'Content', done: !!state.results }
    ];
    $stepper.innerHTML = steps.map((s, i) => `
      <div class="cl-step ${s.done?'done':''}">
        <div class="cl-step-dot ${s.done?'done':''}">${s.done?'✓':i+1}</div>
        <div class="cl-step-label">${s.label}</div>
      </div>
      ${i < steps.length-1 ? '<div class="cl-step-line"></div>' : ''}
    `).join('');
  }

  function updateTheme(){ $root.setAttribute('data-theme', state.industry ? state.industry.theme : ''); }

  function render(){
    updateTheme();
    renderStepper();
    if (state.results) { renderResults(); return; }
    if (state.generating) { renderLoading(); return; }

    const ind = state.industry;
    $body.innerHTML = `
      <div class="cl-hero cl-fade">
        ${ind ? `<svg class="cl-hero-icon" viewBox="0 0 24 24">${ind.icon}</svg>` : ''}
        <h1>${ind ? 'Tuned for ' + esc(ind.name) : 'Content, tuned to your industry'}</h1>
        <p>${ind ? esc(ind.voice) : 'Pick an industry and ContentLoom reshapes tone, vocabulary and story angles around it — not a generic caption generator.'}</p>
        ${ind ? `<div class="cl-hero-pillars">${ind.pillars.map(p => `<span class="cl-pillar-chip">${esc(p)}</span>`).join('')}</div>` : ''}
      </div>

      <div class="cl-section">
        <div class="cl-section-head">
          <div class="cl-section-title"><span class="cl-section-num">1</span> · Industry</div>
          <div class="cl-section-sub">Sets tone, vocabulary and content pillars</div>
        </div>
        <div class="cl-grid4">
          ${industries.map(i => `
            <button class="cl-card ${state.industry && state.industry.id===i.id ? 'selected':''}" data-action="pick-industry" data-id="${i.id}">
              <div class="cl-card-swatch" style="background:${industryColor(i.id)}"></div>
              <div class="cl-card-check">✓</div>
              <svg viewBox="0 0 24 24">${i.icon}</svg>
              <div class="cl-card-name">${esc(i.name)}</div>
              <div class="cl-card-desc">${esc(i.desc)}</div>
            </button>
          `).join('')}
        </div>
      </div>

      <div class="cl-section">
        <div class="cl-section-head">
          <div class="cl-section-title"><span class="cl-section-num">2</span> · Plan duration</div>
          <div class="cl-section-sub">How many posts to generate</div>
        </div>
        <div class="cl-grid3">
          ${plans.map(p => `
            <button class="cl-card cl-plan-card ${state.plan && state.plan.id===p.id?'selected':''}" data-action="pick-plan" data-id="${p.id}">
              <div class="cl-card-check">✓</div>
              <div class="cl-plan-num">${p.posts}</div>
              <div class="cl-plan-label">${esc(p.label)}</div>
              <div class="cl-plan-sub">${esc(p.sub)} · ${p.posts} posts</div>
            </button>
          `).join('')}
        </div>
      </div>

      <div class="cl-section">
        <div class="cl-section-head">
          <div class="cl-section-title"><span class="cl-section-num">3</span> · Reference material <span class="cl-hint">(optional)</span></div>
          <div class="cl-section-sub">PDF, DOC/DOCX, PPT/PPTX, XLS/XLSX, TXT, images</div>
        </div>
        <div class="cl-dropzone" id="clDropzone" data-action="open-file-picker">
          <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M4 17v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
          <div class="cl-dropzone-title">Drop files or click to upload</div>
          <div class="cl-dropzone-sub">Used as context for captions, tone and facts — brochures, price lists, product shots, decks</div>
        </div>
        <input type="file" id="clFileInput" multiple style="display:none" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,image/png,image/jpeg,image/jpg" />
        <div class="cl-files" id="clFiles">
          ${state.files.map((f, idx) => `
            <div class="cl-file-chip">
              <span>${esc(f.name)}</span>
              <span class="status">${f.status==='ready'?'· ready':f.status==='error'?'· not parsed':'· reading…'}</span>
              <button data-action="remove-file" data-idx="${idx}" title="Remove">×</button>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="cl-section">
        <div class="cl-section-head">
          <div class="cl-section-title"><span class="cl-section-num">4</span> · Format</div>
          <div class="cl-section-sub">Choose one or mix formats across the plan</div>
        </div>
        <div class="cl-chips">
          ${formats.map(f => `<button class="cl-chip ${state.selectedFormats.includes(f)?'selected':''}" data-action="toggle-format" data-format="${esc(f)}">${esc(f)}</button>`).join('')}
        </div>
      </div>

      <div class="cl-section">
        ${state.error ? `<div class="cl-error">${esc(state.error)}</div>` : ''}
        <div class="cl-generate-row">
          <button class="cl-btn-primary" data-action="generate" ${(!state.industry || !state.plan) ? 'disabled' : ''}>Generate Content</button>
          <div class="cl-hint">${!state.industry ? 'Select an industry to continue' : !state.plan ? 'Select a duration to continue' : `${state.plan.posts} posts · ${esc(state.industry.name)}`}</div>
        </div>
      </div>
    `;

    document.getElementById('clFileInput').addEventListener('change', handleFileSelect);
    const dz = document.getElementById('clDropzone');
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
    dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag'); handleFiles(e.dataTransfer.files); });
  }

  function industryColor(id){
    return { realestate:'#1E3A5F', jewellery:'#6B1E3C', perfume:'#4B2E52', fmcg:'#A6331E' }[id];
  }

  const loadingMsgs = ['Reading your reference material…','Shaping the tone for your industry…','Drafting captions and visuals…','Assigning hashtags…','Weaving it all together…'];
  function renderLoading(){
    $body.innerHTML = `<div class="cl-loading cl-fade"><div class="cl-spinner"></div><div class="cl-loading-msg" id="clLoadMsg">${loadingMsgs[0]}</div></div>`;
    let i = 0;
    clearInterval(window.__clLoadTimer);
    window.__clLoadTimer = setInterval(() => {
      i = (i+1) % loadingMsgs.length;
      const el = document.getElementById('clLoadMsg');
      if (el) el.textContent = loadingMsgs[i]; else clearInterval(window.__clLoadTimer);
    }, 1500);
  }

  function renderResults(){
    clearInterval(window.__clLoadTimer);
    const ind = state.industry, plan = state.plan;
    $body.innerHTML = `
      <div class="cl-results-head cl-fade">
        <div>
          <div class="cl-results-title">${esc(plan.label)} plan · ${esc(ind.name)}</div>
          <div class="cl-hint">${state.results.length} posts generated</div>
        </div>
        <div class="cl-results-actions">
          <button class="cl-btn-secondary" data-action="copy-all">Copy all</button>
          <button class="cl-btn-secondary" data-action="download-all">Download .txt</button>
          <button class="cl-btn-secondary" data-action="start-over">Start over</button>
        </div>
      </div>
      ${state.error ? `<div class="cl-error">${esc(state.error)}</div>` : ''}
      <div class="cl-posts">
        ${state.results.map((p, idx) => `
          <div class="cl-post cl-fade" style="animation-delay:${Math.min(idx*40,300)}ms">
            <div class="cl-post-top">
              <div>
                <div class="cl-post-num">Post ${p.post_number || idx+1}</div>
                <div class="cl-post-date">${esc(p.date||'')}</div>
              </div>
              <div class="cl-post-format">${esc(p.format || state.selectedFormats[0] || 'Feed Post')}</div>
            </div>
            <div class="cl-post-caption">${esc(p.caption||'')}</div>
            <div>
              <div class="cl-thread">
                <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><path d="M7 12h10"/></svg>
                <span class="cl-thread-label">Visual direction</span>
              </div>
              <div class="cl-post-visual">${esc(p.image_direction||'')}</div>
            </div>
            <div class="cl-hashtags">${(p.hashtags||[]).map(h => `<span class="cl-hashtag">${esc(h.startsWith('#')?h:'#'+h)}</span>`).join('')}</div>
            <button class="cl-post-copy" data-action="copy-post" data-idx="${idx}">Copy post</button>
          </div>
        `).join('')}
      </div>
    `;
  }

  function formatPostText(p, idx){
    const tags = (p.hashtags||[]).map(h => h.startsWith('#')?h:'#'+h).join(' ');
    return `Post ${p.post_number || idx+1} — ${p.date||''} (${p.format||''})\n\nCaption:\n${p.caption||''}\n\nVisual direction:\n${p.image_direction||''}\n\nHashtags:\n${tags}`;
  }
  function allResultsText(){
    return `${state.industry.name} — ${state.plan.label} content plan\n\n` +
      state.results.map((p, idx) => formatPostText(p, idx)).join('\n\n' + '—'.repeat(30) + '\n\n');
  }

  function handleFileSelect(e){ handleFiles(e.target.files); }
  function handleFiles(fileList){
    Array.from(fileList).slice(0, 6 - state.files.length).forEach(file => {
      const entry = { name:file.name, status:'reading', kind:null, content:null, mediaType:null };
      state.files.push(entry);
      readFile(file, entry);
    });
    render();
  }

  function readFile(file, entry){
    const name = file.name.toLowerCase();
    const finish = () => render();
    try {
      if (file.type.startsWith('image/')) {
        entry.kind = 'image';
        const reader = new FileReader();
        reader.onload = () => { entry.mediaType=file.type; entry.content=reader.result.split(',')[1]; entry.status='ready'; finish(); };
        reader.onerror = () => { entry.status='error'; finish(); };
        reader.readAsDataURL(file);
      } else if (name.endsWith('.txt')) {
        entry.kind = 'text';
        const reader = new FileReader();
        reader.onload = () => { entry.content=reader.result.slice(0,4000); entry.status='ready'; finish(); };
        reader.onerror = () => { entry.status='error'; finish(); };
        reader.readAsText(file);
      } else if (name.endsWith('.docx') && window.mammoth) {
        entry.kind = 'text';
        file.arrayBuffer().then(buf => window.mammoth.extractRawText({arrayBuffer:buf}))
          .then(res => { entry.content=(res.value||'').slice(0,4000); entry.status='ready'; finish(); })
          .catch(() => { entry.status='error'; finish(); });
      } else if ((name.endsWith('.xlsx')||name.endsWith('.xls')) && window.XLSX) {
        entry.kind = 'text';
        file.arrayBuffer().then(buf => {
          const wb = window.XLSX.read(buf, {type:'array'});
          let out = '';
          wb.SheetNames.slice(0,3).forEach(sn => { out += `Sheet: ${sn}\n` + window.XLSX.utils.sheet_to_csv(wb.Sheets[sn]) + '\n'; });
          entry.content = out.slice(0,4000); entry.status='ready'; finish();
        }).catch(() => { entry.status='error'; finish(); });
      } else if (name.endsWith('.pdf') && window.pdfjsLib) {
        entry.kind = 'text';
        file.arrayBuffer().then(buf => window.pdfjsLib.getDocument({data:buf}).promise)
          .then(async pdf => {
            let text = '';
            for (let p=1; p<=Math.min(pdf.numPages,8); p++){
              const page = await pdf.getPage(p);
              const content = await page.getTextContent();
              text += content.items.map(it => it.str).join(' ') + '\n';
              if (text.length > 4000) break;
            }
            entry.content = text.slice(0,4000); entry.status='ready'; finish();
          }).catch(() => { entry.status='error'; finish(); });
      } else {
        entry.kind = 'note'; entry.status = 'ready'; entry.content = null; finish();
      }
    } catch (err) { entry.status = 'error'; finish(); }
  }

  async function generate(){
    state.generating = true; state.error = null; render();
    try {
      const ind = state.industry, plan = state.plan;
      const fmts = state.selectedFormats.length ? state.selectedFormats : ['Feed Post'];
      const refText = state.files.filter(f => f.kind==='text' && f.content).map(f => `--- ${f.name} ---\n${f.content}`).join('\n\n');
      const refImages = state.files.filter(f => f.kind==='image' && f.content);
      const unparsed = state.files.filter(f => f.kind==='note').map(f => f.name);

      const systemPrompt = `You are a senior social media content strategist who specialises in the ${ind.name} industry.
Write content that is unmistakably built for this industry — never generic, interchangeable marketing copy.

Voice and tone for this industry: ${ind.voice}
Core content pillars to draw from across the plan (rotate through these, don't repeat the same pillar every post): ${ind.pillars.join(', ')}.

You will generate a ${plan.label} social media content plan with exactly ${plan.posts} posts.
Available formats to use: ${fmts.join(', ')}. ${fmts.length>1 ? "Vary the format across posts sensibly (e.g. carousels for detailed stories, reels for mood/behind-the-scenes, feed posts for announcements)." : 'Use this format for every post.'}
Spread post dates naturally across the ${plan.label} period (e.g. "Week 1 · Monday", "Day 3", etc — pick a labelling style that fits the duration).

Respond with ONLY a valid JSON array (no markdown fences, no commentary), where each item has exactly these fields:
{
  "post_number": number,
  "date": "short date/day label",
  "format": "one of the available formats",
  "caption": "the full social media caption, written in the industry voice, 2-5 sentences, ready to publish",
  "image_direction": "a concrete description of what image or video should be created/used for this post",
  "hashtags": ["array", "of", "6-10", "relevant", "hashtags", "without spaces"]
}
Return exactly ${plan.posts} items in the array.`;

      const userContent = [];
      let userText = `Generate the ${plan.label} (${plan.posts} posts) content plan for the ${ind.name} industry now.`;
      if (refText) userText += `\n\nUse the following reference material as factual/contextual grounding where relevant:\n${refText}`;
      if (unparsed.length) userText += `\n\nAdditional reference files were provided (content not machine-readable, but treat them as relevant supporting material by name): ${unparsed.join(', ')}`;
      userContent.push({ type:'text', text:userText });
      refImages.forEach(f => { userContent.push({ type:'image', source:{ type:'base64', media_type:f.mediaType, data:f.content } }); });

      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 4096,
          system: systemPrompt,
          messages: [{ role:'user', content:userContent }]
        })
      });
      const data = await response.json();
      const textBlock = (data.content||[]).find(b => b.type==='text');
      if (!textBlock) throw new Error('No content returned');
      let clean = textBlock.text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
      const parsed = JSON.parse(clean);
      if (!Array.isArray(parsed) || !parsed.length) throw new Error('Unexpected response format');

      state.results = parsed; state.generating = false; render();
    } catch (err) {
      state.generating = false;
      state.error = "Couldn't generate content just now — " + (err.message || 'please try again.');
      render();
    }
  }

  $root.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    if (action === 'pick-industry') { state.industry = industries.find(i => i.id===el.dataset.id); render(); }
    else if (action === 'pick-plan') { state.plan = plans.find(p => p.id===el.dataset.id); render(); }
    else if (action === 'open-file-picker') { document.getElementById('clFileInput').click(); }
    else if (action === 'remove-file') { state.files.splice(Number(el.dataset.idx),1); render(); }
    else if (action === 'toggle-format') {
      const f = el.dataset.format; const i = state.selectedFormats.indexOf(f);
      if (i>-1) { if (state.selectedFormats.length>1) state.selectedFormats.splice(i,1); } else state.selectedFormats.push(f);
      render();
    }
    else if (action === 'generate') { generate(); }
    else if (action === 'start-over') { state.results=null; state.error=null; render(); }
    else if (action === 'copy-all') { navigator.clipboard.writeText(allResultsText()); el.textContent='Copied ✓'; setTimeout(()=>el.textContent='Copy all',1400); }
    else if (action === 'download-all') {
      const blob = new Blob([allResultsText()], {type:'text/plain'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `${state.industry.id}-${state.plan.id}-content-plan.txt`; a.click();
    }
    else if (action === 'copy-post') {
      const idx = Number(el.dataset.idx);
      navigator.clipboard.writeText(formatPostText(state.results[idx], idx));
      el.textContent='Copied ✓'; setTimeout(()=>el.textContent='Copy post',1400);
    }
  });

  function loadScript(src){ const s=document.createElement('script'); s.src=src; s.async=true; document.body.appendChild(s); }
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  setTimeout(() => { if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }, 800);

  render();
})();
</script>
